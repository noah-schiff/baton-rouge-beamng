# The CC0 textures the textures stage downloads (brmap.textures.fetch), 1K JPG, from ambientCG
# (https://ambientcg.com/) and Poly Haven (https://polyhaven.com/). Both publish them under CC0 1.0
# (https://creativecommons.org/publicdomain/zero/1.0/), so the level may use and ship them.
# docs/textures.md lists every texture with its page.
#
#   tex_id:                       # a material says tex:<tex_id> (src/brmap/data/*_materials.yaml)
#     source: ambientcg | polyhaven
#     asset: <the asset's id on the site>
#     maps: {b|nm|r|o: <the map's name on the site>}
#                                 # b colour, nm normal (always the OpenGL variant: green = +V up, as the
#                                 # in-game spike S1 found), r roughness, o opacity
#     license: CC0-1.0
#     sha256: {map: hex}          # of the downloaded file, checked on every run (a mismatch raises)
#
# ambientCG names a map in the zip <asset>_1K-JPG_<name>.jpg; Poly Haven serves <asset>_<name>_1k.jpg.

