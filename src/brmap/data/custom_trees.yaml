    detailFreq: 5
    mass: 200
    rigidity: 100
    tightnessCoefficient: 4
    trunkBendScale: 0.00999999978
    windScale: 0.400000006
  materials: [br_tree_moss]
  billboard: false

br_moss_holm_oak:
