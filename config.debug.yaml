# Small 3 km test map around the same center, for quick in-game checks.
# Same downloads as config.yaml; separate outputs and level name, so both maps can
# sit in the BeamNG mods folder at once. Run: python -m brmap all --config config.debug.yaml

extent:
  center_lat: 30.430
  center_lon: -91.160
  half_size_m: 8192
  buffer_m: 500
  debug_half_size_m: 1500   # 3 km square

terrain:
  size: 1024                # 2.9 m per cell over 3 km
  z_min: -15.0
  z_max: 40.0

bridges:
  clearance_m: 5.5
  overrides:
    Horace Wilkinson Bridge: 52.0

buildings:
  microsoft: true
  tile_m: 256

trees:
  max_count: 20000

markings:
  enabled: true

traffic:
  enabled: true

level:
  name: baton_rouge_debug
  title: Baton Rouge 1:1 (3 km test)
  authors: Noah Schiff

paths:
  raw: data/raw
  out: data/out_debug
  dist: dist/debug
