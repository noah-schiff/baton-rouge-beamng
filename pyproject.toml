[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brmap"
version = "0.1.0"
description = "Builds a 1:1 Baton Rouge map for BeamNG.drive from public geodata"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3.9",
    "pyproj>=3.6",
    "shapely>=2.0",
    "requests>=2.31",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "osmium>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brmap = ["data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
